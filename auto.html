<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <title>esercizio auto</title>
  </head>
  <body>
    <h1>Auto usate</h1>
    
    <div>
        <button id="btnCaricaTutto">Visualizza Intero Archivio</button>
        <button id="btnCaricaUniproprietario">visualizza Uniproprietario</button>
    </div>

    <div>
        Provincia: 
        <input type="text" id="provinciaRichiesta" placeholder="Es Milano">
        <button id="btnCercaProvincia">cerca Provincia</button>
    </div>

    <div>
        Marca: 
        <input type="text" id="marcaRichiesta" placeholder="marca">
        <button id="btnCercaMarca">Cerca marca</button>
    </div>

    <div>
        Immatricolazione da Anno: <input type="text" id="annoX" placeholder="2000"> 
        a Anno: <input type="text" id="annoY" placeholder="2010">
        <button id="btnCercaAnni">Filtra per Anno</button>
    </div>

    <div id="archivioAuto">
    </div>

    <script>
      let contenitoreAuto=document.querySelector("#archivioAuto");

      function resetRisultati() {
        contenitoreAuto.innerHTML = "";
      }

      // Genera una riga di testo semplice per ogni auto trovata
      function generaRigaAuto(autoSingola) {
        let proprietarioText = autoSingola.Uniproprietario ? "Sì" : "No";
        return "<div>Marca: " + autoSingola.Marca + "Modello: " + autoSingola.Modello + "Anno: " + autoSingola.Anno + "Provincia: " + autoSingola.Provincia + "Uniproprietario: " + proprietarioText + "KM: " + autoSingola.Kilometraggio + "</div>";
      }

      //visualizza archivio
      async function leggiArchivio(){
        const promise=await fetch("auto.json");
        const auto=await promise.json();

        resetRisultati();

        for(let i=0; i<auto.length; i++){
          contenitoreAuto.innerHTML += generaRigaAuto(auto[i]);
        }
      }

      //visualizza uniproprietario
      async function cercaProprietario(){
        const promise=await fetch("auto.json");
        const auto=await promise.json();

        resetRisultati();

        for(let i=0; i<auto.length; i++){
          if(auto[i].Uniproprietario===true){
            contenitoreAuto.innerHTML += generaRigaAuto(auto[i]);
          }
        }
      }

      //funzione per cercare le auto di una specifica provincia
      async function cercaProvincia(){
        let provInput=document.querySelector("#provinciaRichiesta").value;
        const promise=await fetch("auto.json");
        const auto=await promise.json();

        resetRisultati();
        for(let i=0; i<auto.length; i++){
          if(auto[i].Provincia===provInput){
            contenitoreAuto.innerHTML += generaRigaAuto(auto[i]);
          }
        }
      }

      //funzione x cercare auto x marca
      async function cercaMarca(){
        let marcaInput=document.querySelector("#marcaRichiesta").value;
        const promise=await fetch("auto.json");
        const auto=await promise.json();
        
        resetRisultati();
        
        for(let i=0; i<auto.length; i++){
          if(auto[i].Marca==marcaInput){
            contenitoreAuto.innerHTML += generaRigaAuto(auto[i]);
          }
        }
      }

      //funzione x filtrarw le auto x anno
      async function cercaAnni(){
        let annoInizio=parseInt(document.querySelector("#annoX").value);
        let annoFine=parseInt(document.querySelector("#annoY").value);
        const promise=await fetch("auto.json");
        const auto=await promise.json();
        
        resetRisultati();
        
        for(let i=0; i<auto.length; i++){
          if(auto[i].Anno>annoInizio && auto[i].Anno<=annoFine){
            contenitoreAuto.innerHTML += generaRigaAuto(auto[i]);
          }
        }
      }

      //associazione delle funzioni ai click dei bottoni
      let btnCaricaTutto=document.querySelector("#btnCaricaTutto");
      btnCaricaTutto.addEventListener("click", leggiArchivio);

      let btnCercaProvincia=document.querySelector("#btnCercaProvincia");
      btnCercaProvincia.addEventListener("click", cercaProvincia);
      
      let btnCaricaUniproprietario=document.querySelector("#btnCaricaUniproprietario");
      btnCaricaUniproprietario.addEventListener("click", cercaProprietario);
      
      let btnCercaMarca=document.querySelector("#btnCercaMarca");
      btnCercaMarca.addEventListener("click", cercaMarca);

      let btnCercaAnni=document.querySelector("#btnCercaAnni");
      btnCercaAnni.addEventListener("click", cercaAnni);
    </script>
  </body>
</html>
